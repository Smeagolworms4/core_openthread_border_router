name: auto release

# Vérifie la version upstream du Home Assistant OpenThread Border Router addon
# et crée automatiquement les tags + releases manquants (toutes les 4h).
# Le tag est poussé avec un PAT (RELEASE_PAT) afin de déclencher build_images.yml
# (un tag poussé par le GITHUB_TOKEN par défaut ne déclenche aucun workflow).

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Check upstream and create missing releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          UPSTREAM_BASE: https://raw.githubusercontent.com/home-assistant/addons/master/openthread_border_router
        run: |
          set -euo pipefail

          # Récupère le CHANGELOG upstream (il liste toutes les versions dans l'ordre)
          curl -fsSL "${UPSTREAM_BASE}/CHANGELOG.md" -o upstream_changelog.md

          # Liste ordonnée des versions présentes dans le changelog upstream
          UPSTREAM_VERSIONS=$(grep -oP '^##\s+\K[0-9]+\.[0-9]+\.[0-9]+' upstream_changelog.md)
          echo "Versions upstream:"
          echo "$UPSTREAM_VERSIONS"

          # Dernière version déjà taguée dans le fork (0.0.0 si aucune)
          git fetch --tags --quiet
          CURRENT=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          CURRENT=${CURRENT:-0.0.0}
          echo "Version courante du fork: $CURRENT"

          # Versions upstream strictement supérieures à la courante (filtrage via sort -V)
          NEW_VERSIONS=$(for v in $UPSTREAM_VERSIONS; do
            top=$(printf '%s\n%s\n' "$CURRENT" "$v" | sort -V | tail -n1)
            if [ "$v" = "$top" ] && [ "$v" != "$CURRENT" ]; then
              echo "$v"
            fi
          done | sort -V)

          if [ -z "$NEW_VERSIONS" ]; then
            echo "Aucune nouvelle version. Rien à faire."
            exit 0
          fi

          echo "Nouvelles versions à publier:"
          echo "$NEW_VERSIONS"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for v in $NEW_VERSIONS; do
            if git rev-parse "$v" >/dev/null 2>&1; then
              echo "Tag $v existe déjà, on saute."
              continue
            fi

            # L'image de base upstream est publiée avec un délai après l'entrée
            # au changelog. On ne crée le tag que si elle existe, sinon le build
            # échoue. Réessai au prochain cron.
            #  - >= 3.4.0 : image multi-arch sur GHCR
            #  - <  3.4.0 : homeassistant/<arch>-addon-otbr sur Docker Hub
            img_ready=true
            accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"
            if [ "$(printf '%s\n%s\n' 3.4.0 "$v" | sort -V | head -n1)" = "3.4.0" ]; then
              repo="home-assistant/app-openthread-border-router"
              gh_token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
              platforms=$(curl -fsSL -H "Authorization: Bearer $gh_token" -H "Accept: $accept" \
                "https://ghcr.io/v2/${repo}/manifests/$v" 2>/dev/null \
                | jq -r '.manifests[]?.platform.architecture' || true)
              for arch in amd64 arm64; do
                if ! printf '%s\n' "$platforms" | grep -qx "$arch"; then
                  echo "Image ghcr.io/${repo}:$v ($arch) pas encore disponible."
                  img_ready=false
                fi
              done
            else
              for arch in amd64 aarch64; do
                repo="homeassistant/${arch}-addon-otbr"
                dh_token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $dh_token" -H "Accept: $accept" \
                  "https://registry-1.docker.io/v2/${repo}/manifests/$v")
                if [ "$code" != "200" ]; then
                  echo "Image ${repo}:$v pas encore disponible (HTTP $code)."
                  img_ready=false
                fi
              done
            fi
            if [ "$img_ready" != "true" ]; then
              echo "Report de $v au prochain cron."
              continue
            fi

            # Extrait les notes de cette version depuis le changelog upstream
            NOTES=$(awk -v ver="$v" '
              $0 ~ "^##[ \t]+" ver "([ \t]|$)" {flag=1; next}
              /^##[ \t]/ && flag {exit}
              flag {print}
            ' upstream_changelog.md | sed '/^[[:space:]]*$/d')
            [ -z "$NOTES" ] && NOTES="- Bump to upstream version $v"

            echo "=== Création tag + release $v ==="
            printf '%s\n' "$NOTES" > notes.md
            git tag -a "$v" -F <(printf 'Release %s\n\n%s\n' "$v" "$NOTES")
            git push origin "$v"
            gh release create "$v" --title "$v" --notes-file notes.md
          done
